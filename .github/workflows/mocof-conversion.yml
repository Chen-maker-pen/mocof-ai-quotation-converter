name: MOCOF quotation conversion

on:
  repository_dispatch:
    types: [mocof-conversion]
  workflow_dispatch:
    inputs:
      job_id:
        description: Persistent MOCOF conversion job id
        required: true
        type: string

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: mocof-${{ github.event.client_payload.jobId || github.event.inputs.job_id }}
      cancel-in-progress: false
    env:
      MOCOF_BACKGROUND_WORKER: 'true'
      # The worker may take time for customer-ready translations and template
      # recipes. It is deliberately outside the Vercel function time limit.
      MOCOF_ENABLE_GEMINI_TRANSLATION: 'true'
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MOCOF_RECIPE_ASSETS_1: ${{ secrets.MOCOF_RECIPE_ASSETS_1 }}
      MOCOF_RECIPE_ASSETS_2: ${{ secrets.MOCOF_RECIPE_ASSETS_2 }}
      MOCOF_RECIPE_ASSETS_3: ${{ secrets.MOCOF_RECIPE_ASSETS_3 }}
      MOCOF_RECIPE_ASSETS_4: ${{ secrets.MOCOF_RECIPE_ASSETS_4 }}
      MOCOF_RECIPE_ASSETS_5: ${{ secrets.MOCOF_RECIPE_ASSETS_5 }}
    steps:
      - name: Load private job reference
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const id = event.client_payload?.jobId || event.inputs?.job_id;
          if (!/^job-[0-9]+-[a-f0-9]+$/.test(id || '')) throw Error('Invalid job reference');
          console.log('::add-mask::' + id);
          fs.appendFileSync(process.env.GITHUB_ENV, 'MOCOF_JOB_ID=' + id + '\n');
          NODE
      - name: Check out the converter
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install same-workbook PDF renderer and CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-calc fonts-noto-cjk fonts-crosextra-carlito
      - name: Convert quotation in the background
        run: npx tsx worker/githubAction.ts
