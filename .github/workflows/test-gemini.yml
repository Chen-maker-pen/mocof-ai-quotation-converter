name: Test Gemini Connection

on:
  workflow_dispatch:
    inputs:
      verify_sequential:
        description: Run private ordered-prompt acceptance and encrypt the report
        type: boolean
        default: false
      verify_worker:
        description: Test the actual worker SDK and structured responses
        type: boolean
        default: false
      source_job_id:
        description: Optional existing private source job (read-only test)
        type: string
        default: ''
      source_sha256:
        description: Expected source hash; required for private-source test
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out worker code
        if: inputs.verify_worker || inputs.verify_sequential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: inputs.verify_worker || inputs.verify_sequential
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: inputs.verify_worker || inputs.verify_sequential
        run: npm install --no-audit --no-fund
      - name: Run regression checks
        if: inputs.verify_worker
        run: node --import tsx --test tests/*.test.ts
      - name: Verify worker with existing secrets
        if: inputs.verify_worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MOCOF_BACKGROUND_WORKER: 'true'
          MOCOF_TEST_SOURCE_JOB_ID: ${{ inputs.source_job_id }}
          MOCOF_TEST_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: node --import tsx scripts/verifyGeminiWorker.ts
      - name: Verify all private recipe sections in order
        if: inputs.verify_sequential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MOCOF_PRIVATE_ACCEPTANCE: ${{ secrets.MOCOF_PRIVATE_ACCEPTANCE }}
          MOCOF_TEST_SOURCE_JOB_ID: ${{ inputs.source_job_id }}
          MOCOF_TEST_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: node --import tsx scripts/verifySequential.ts
      - name: Save encrypted acceptance report
        if: ${{ always() && inputs.verify_sequential }}
        uses: actions/upload-artifact@v4
        with:
          name: private-acceptance-encrypted
          path: private-acceptance.enc
          retention-days: 3
          if-no-files-found: error
      - name: Test existing Gemini secret
        if: ${{ !inputs.verify_worker && !inputs.verify_sequential }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import os
          import json
          import sys
          import urllib.request
          import urllib.error

          key = os.environ.get("GEMINI_API_KEY", "").strip()

          if not key:
              print("FAIL: GEMINI_API_KEY secret is empty or missing.")
              sys.exit(1)

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.6-flash:generateContent"
          )

          payload = {
              "contents": [{
                  "parts": [{"text": "Reply with OK only."}]
              }]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print("HTTP:", response.status)
                  print("PASS: Gemini connection works.")
          except urllib.error.HTTPError as error:
              print("HTTP:", error.code)
              try:
                  body = json.loads(error.read().decode())
                  message = body.get("error", {}).get("message", "")
                  print("DETAIL:", message.replace(key, "[REDACTED]")[:600])
              except Exception:
                  print("Could not read the error details.")
              sys.exit(1)
          except Exception:
              print("FAIL: Network connection or timeout error.")
              sys.exit(1)
