name: Private release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOCOF_BACKGROUND_WORKER: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      MOCOF_RELEASE_TEST_INPUT: ${{ secrets.MOCOF_RELEASE_TEST_INPUT }}
      MOCOF_RECIPE_ASSETS_1: ${{ secrets.MOCOF_RECIPE_ASSETS_1 }}
      MOCOF_RECIPE_ASSETS_2: ${{ secrets.MOCOF_RECIPE_ASSETS_2 }}
      MOCOF_RECIPE_ASSETS_3: ${{ secrets.MOCOF_RECIPE_ASSETS_3 }}
      MOCOF_RECIPE_ASSETS_4: ${{ secrets.MOCOF_RECIPE_ASSETS_4 }}
      MOCOF_RECIPE_ASSETS_5: ${{ secrets.MOCOF_RECIPE_ASSETS_5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-calc fonts-noto-cjk fonts-crosextra-carlito
      - run: node --import tsx scripts/verifyRelease.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-release-encrypted
          path: private-acceptance.enc
          retention-days: 14
